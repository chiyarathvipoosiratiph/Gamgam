    --yellow: #ffd166;
    --yellow-light: #fff6df;
    --text: #4a3b45;
    --muted: #9b8a94;
    --bg: #fff8fa;

  body{

    background: linear-gradient(180deg, #fff0f5 0%, #f3fff8 100%);

    padding-bottom:60px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background: linear-gradient(120deg, var(--pink), #ff9bbf);

    padding:20px 16px 16px;
    border-radius: 0 0 28px 28px;
    box-shadow: var(--shadow);
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.5rem;
    font-weight:800;
  }
  .avatar{
    width:84px;
    height:84px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    margin-bottom:6px;
    background:white;
  }
  header p{
    margin:0;
    font-size:0.85rem;
    opacity:0.95;
  }
  .progress-wrap{
    max-width:480px;
    margin:14px auto 0;
    background:rgba(255,255,255,0.35);
    border-radius:20px;
    padding:10px 14px;
  }
  .progress-bar-bg{
    background:rgba(255,255,255,0.4);
    border-radius:20px;
    height:14px;
    overflow:hidden;
    margin-top:6px;
  }
  .progress-bar-fill{
    background: var(--green);
    height:100%;
    border-radius:20px;
    transition: width 0.4s ease;
  }
  .progress-label{
    font-size:0.8rem;
    font-weight:600;
    display:flex;
    justify-content:space-between;
  }
  main{
    max-width:480px;
    margin:18px auto;
    padding:0 14px;
  }
  .day-card{
    background:var(--card);
    border-radius:22px;
    box-shadow: var(--shadow);
    margin-bottom:18px;
    overflow:hidden;
    border: 2px solid var(--pink-light);
  }
  .day-card.mock{
    border-color: var(--yellow);
  }
  .day-card.done{
    border-color: var(--green);
  }
  .day-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    background: var(--pink-light);
    cursor:pointer;
    user-select:none;
  }
  .day-card.mock .day-head{ background: var(--yellow-light); }
  .day-card.done .day-head{ background: var(--green-light); }
  .day-title{
    display:flex;
    flex-direction:column;
  }
  .day-title .dname{ font-weight:800; font-size:1.05rem; }
  .day-title .ddate{ font-size:0.78rem; color:var(--muted); }
  .day-badge{
    font-size:0.7rem;
    font-weight:700;
    background:var(--pink);
    color:white;
    padding:3px 10px;
    border-radius:12px;
  }
  .day-card.mock .day-badge{ background:#f2a900; }
  .day-card.done .day-badge{ background:var(--green-dark); }
  .day-count{
    font-size:0.8rem;
    font-weight:700;
    color:var(--pink-dark);
    margin-right:8px;
  }
  .day-card.mock .day-count{ color:#b9790a; }
  .day-card.done .day-count{ color:var(--green-dark); }
  .chevron{
    transition: transform 0.25s ease;
    font-size:0.9rem;
    color: var(--muted);
  }
  .day-card.open .chevron{ transform: rotate(180deg); }
  .day-body{
    max-height:0;
    overflow:hidden;
    transition: max-height 0.35s ease;
  }
  .day-card.open .day-body{ max-height:900px; }
  .session{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    border-top:1px dashed #ffe0ea;
  }
  .day-card.mock .session{ border-top-color:#ffedbb; }
  .session .time{
    font-size:0.72rem;
    color:var(--muted);
    width:78px;
    flex-shrink:0;
    font-weight:600;
  }
  .session .info{

  }
  .session .subj{

    font-size:0.92rem;
  }
  .session .detail{
    font-size:0.76rem;

  }
  .checkbox{
    width:26px; height:26px;
    border-radius:50%;

    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background:white;
    transition: all 0.15s ease;
    font-size:0.9rem;
  }
  .checkbox.checked{

  .chart-section{

    font-weight:800;
    font-size:1rem;

    align-items:center;

    font-size:0.72rem;
    font-weight:700;
  }
  .chart-legend .dot{
    width:10px; height:10px; border-radius:50%;

  { key:"phys", label:"ฟิสิกส์", color:"#4fcf8f" },

const STORAGE_KEY = "study_tracker_sep69_v1";
let state = {};
try {
  state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
} catch(e) { state = {}; }

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function keyFor(dateIdx, sessionIdx){
  return dateIdx + "_" + sessionIdx;
}

const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  let totalDone = 0, totalAll = 0;

  days.forEach((day, di) => {
    const card = document.createElement("div");
    card.className = "day-card" + (day.mock ? " mock" : "");

    const doneCount = day.sessions.filter((_, si) => state[keyFor(di, si)]).length;
    totalDone += doneCount;
    totalAll += day.sessions.length;
    if (doneCount === day.sessions.length) card.classList.add("done");

    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = `
      <div class="day-title">
        <span class="dname">${day.day} ${day.mock ? "🌟" : ""}</span>
        <span class="ddate">${day.date}</span>
      </div>
      <div style="display:flex; align-items:center;">
        <span class="day-count">${doneCount}/${day.sessions.length}</span>
        <span class="chevron">▾</span>
      </div>
    `;
    head.addEventListener("click", () => {
      card.classList.toggle("open");
    });

    const body = document.createElement("div");
    body.className = "day-body";

    day.sessions.forEach((sess, si) => {
      // insert breakfast divider before period index 1 (after period 0)
      if (si === 1) {
        const meal = document.createElement("div");
        meal.className = "meal-row";
        meal.innerHTML = `<span class="icon">🍳</span> ${MEAL_BREAKFAST}`;
        body.appendChild(meal);
      }
      if (si === 5) {
        const meal = document.createElement("div");
        meal.className = "meal-row";
        meal.innerHTML = `<span class="icon">🍚</span> ${MEAL_LUNCH}`;
        body.appendChild(meal);
      }

      const row = document.createElement("div");
      row.className = "session";
      const checked = !!state[keyFor(di, si)];
      row.innerHTML = `
        <div class="time">${TIMES[si]}</div>
        <div class="info">
          <div class="subj">${sess.s}</div>
          ${sess.d ? `<div class="detail">${sess.d}</div>` : ""}
        </div>
        <div class="checkbox ${checked ? "checked" : ""}" data-di="${di}" data-si="${si}">
          ${checked ? "✓" : ""}
        </div>
      `;
      body.appendChild(row);
    });

    if (day.mock) {
      const scoreWrap = document.createElement("div");
      scoreWrap.className = "mock-score-wrap";
      const grid = MOCK_SUBJECTS.map(sub => {
        const val = state["mockscore_" + day.isoDate + "_" + sub.key];
        return `<label>${sub.label}
          <input type="number" min="0" max="100" placeholder="-" 
            data-iso="${day.isoDate}" data-subj="${sub.key}" 
            class="mock-score-input" value="${val !== undefined ? val : ""}">
        </label>`;
      }).join("");
      scoreWrap.innerHTML = `<div class="msw-title">📊 คะแนนที่ทำได้ (เต็ม 100)</div>
        <div class="mock-score-grid">${grid}</div>`;
      body.appendChild(scoreWrap);
    }

    const noteWrap = document.createElement("div");
    noteWrap.className = "note-wrap";
    const existingNote = state["note_" + di] || "";
    noteWrap.innerHTML = `<label>📝 จุดที่ผิด / สิ่งที่ต้องทบทวน</label>
      <textarea class="note-input" data-di="${di}" placeholder="เช่น วันนี้งงเรื่องเวกเตอร์ ต้องทวนอีกรอบ...">${existingNote}</textarea>`;
    body.appendChild(noteWrap);

    if (doneCount === day.sessions.length) {
      const cel = document.createElement("div");
      cel.className = "celebrate";
      cel.textContent = "🎉 อ่านครบวันนี้แล้ว เก่งมาก!";
      body.appendChild(cel);
    }

    card.appendChild(head);
    card.appendChild(body);
    app.appendChild(card);
  });

  app.querySelectorAll(".checkbox").forEach(box => {
    box.addEventListener("click", (e) => {
      e.stopPropagation();
      const di = box.dataset.di, si = box.dataset.si;
      const k = keyFor(di, si);
      state[k] = !state[k];
      saveState();
      render();
    });
  });

  app.querySelectorAll(".note-input").forEach(ta => {
    ta.addEventListener("click", (e) => e.stopPropagation());
    ta.addEventListener("input", () => {
      state["note_" + ta.dataset.di] = ta.value;
      saveState();
    });
  });

  app.querySelectorAll(".mock-score-input").forEach(inp => {
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("input", () => {
      const v = inp.value === "" ? undefined : Math.max(0, Math.min(100, Number(inp.value)));
      if (v === undefined) {
        delete state["mockscore_" + inp.dataset.iso + "_" + inp.dataset.subj];
      } else {
        state["mockscore_" + inp.dataset.iso + "_" + inp.dataset.subj] = v;
      }
      saveState();
      renderChart();
    });
  });

  document.getElementById("overallText").textContent = totalDone + "/" + totalAll;
  document.getElementById("overallFill").style.width = (totalAll ? (totalDone/totalAll*100) : 0) + "%";

  updateStreak();
  renderChart();
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function updateCountdown(){
  const today = todayISO();
  const next = EXAM_DATES.find(e => e.date >= today);
  const el = document.getElementById("countdownStat");
  if (!next) { el.textContent = "🎉 สอบครบทุกสนามแล้ว"; return; }
  const diffDays = Math.ceil((new Date(next.date) - new Date(today)) / 86400000);
  el.textContent = diffDays === 0
    ? `⏳ วันนี้สอบ ${next.name}!`
    : `⏳ อีก ${diffDays} วัน ถึง ${next.name}`;
}

function updateStreak(){
  const today = todayISO();
  let lastIdx = -1;
  for (let i = 0; i < days.length; i++) {
    if (days[i].isoDate <= today) lastIdx = i;
  }
  const streakEl = document.getElementById("streakStat");
  if (lastIdx === -1) { streakEl.textContent = "🔥 ต่อเนื่อง 0 วัน"; return; }

  const isDayDone = (i) => days[i].sessions.every((_, si) => !!state[keyFor(i, si)]);

  let start = lastIdx;
  if (days[lastIdx].isoDate === today && !isDayDone(lastIdx)) start = lastIdx - 1;

  let streak = 0;
  for (let i = start; i >= 0; i--) {
    if (isDayDone(i)) streak++; else break;
  }
  streakEl.textContent = `🔥 ต่อเนื่อง ${streak} วัน`;
}

function renderChart(){
  const area = document.getElementById("chartArea");
  const points = days.filter(d => d.mock).map(d => {
    const scores = {};
    MOCK_SUBJECTS.forEach(sub => {
      const v = state["mockscore_" + d.isoDate + "_" + sub.key];
      if (v !== undefined) scores[sub.key] = v;
    });
    return { date: d.date, isoDate: d.isoDate, scores };
  }).filter(p => Object.keys(p.scores).length > 0);

  if (points.length === 0) {
    area.innerHTML = `<div class="chart-empty">กรอกคะแนนหลังทำ Mock Exam แต่ละครั้ง แล้วกราฟจะขึ้นตรงนี้ค่ะ 🌱</div>`;
    return;
  }

  const W = 300, H = 160, padL = 28, padR = 10, padT = 10, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xStep = points.length > 1 ? plotW / (points.length - 1) : 0;
  const yFor = (score) => padT + plotH - (score / 100) * plotH;
  const xFor = (i) => padL + xStep * i;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:400px; display:block; margin:0 auto;">`;

  // gridlines + y labels (0,40,80 target line dashed)
  [0, 20, 40, 60, 80, 100].forEach(v => {
    const y = yFor(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#f2e6ea" stroke-width="1"/>`;
    svg += `<text x="2" y="${y+3}" font-size="7" fill="#9b8a94">${v}</text>`;
  });
  // target 80 line highlighted
  const y80 = yFor(80);
  svg += `<line x1="${padL}" y1="${y80}" x2="${W-padR}" y2="${y80}" stroke="#4fcf8f" stroke-width="1.2" stroke-dasharray="4,3"/>`;

  MOCK_SUBJECTS.forEach(sub => {
    const vals = points.map((p, i) => p.scores[sub.key] !== undefined ? { x: xFor(i), y: yFor(p.scores[sub.key]) } : null);
    const valid = vals.filter(v => v);
    if (valid.length === 0) return;
    let path = "";
    vals.forEach((v, i) => {
      if (!v) return;
      path += (path === "" ? "M" : "L") + v.x.toFixed(1) + "," + v.y.toFixed(1) + " ";
    });
    svg += `<path d="${path}" fill="none" stroke="${sub.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    vals.forEach(v => {
      if (!v) return;
      svg += `<circle cx="${v.x}" cy="${v.y}" r="3.2" fill="${sub.color}"/>`;
    });
  });

  // x labels
  points.forEach((p, i) => {
    svg += `<text x="${xFor(i)}" y="${H-6}" font-size="7" fill="#9b8a94" text-anchor="middle">${p.date}</text>`;
  });

  svg += `</svg>`;

  const legend = MOCK_SUBJECTS.map(sub =>
    `<div class="item"><span class="dot" style="background:${sub.color}"></span>${sub.label}</div>`
  ).join("");

  area.innerHTML = `<div class="chart-box">${svg}<div class="chart-legend">${legend}</div></div>`;
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("ลบข้อมูลติ๊กถูกทั้งหมดเลยไหมคะ?")) {
    state = {};
    saveState();
    render();
  }
});

render();
updateCountdown();

// open today's card automatically if it matches (best-effort, based on device date)
</script>
